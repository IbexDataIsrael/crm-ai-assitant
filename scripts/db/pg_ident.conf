# CRM Assistant - OS users inside the db container that may log in as the
# admin role over the local socket (see pg_hba.conf, "peer map=local_admin").
# Mounted read-only at /etc/postgresql/pg_ident.conf.
#
# MAPNAME       SYSTEM-USERNAME   PG-USERNAME
local_admin     root              crm_assistant
local_admin     postgres          crm_assistant
