# CRM Assistant - who may log in to PostgreSQL, and how.
# Mounted read-only at /etc/postgresql/pg_hba.conf (docker-compose.yml passes
# hba_file=...). Postgres uses the first line that matches; a connection that
# matches no line is rejected. No "trust" anywhere.
# After editing: docker compose exec db psql -U crm_assistant -d crm_assistant -c "SELECT pg_reload_conf()"
# and check: ... -c "SELECT * FROM pg_hba_file_rules WHERE error IS NOT NULL"
#
# TYPE  DATABASE            USER           ADDRESS   METHOD

# Admin / recovery: only through the Unix socket INSIDE the db container
# (docker compose exec db psql -U crm_assistant ...). "peer" checks the
# container's OS user; pg_ident.conf maps root and postgres to crm_assistant.
local   all                 crm_assistant            peer map=local_admin

# The app and the tests: password (SCRAM-SHA-256) only, only from the db
# container's own network (the compose network), each role only to its own
# database. The admin role has no network line, so it cannot log in remotely.
host    crm_assistant       crm_app        samenet   scram-sha-256
host    crm_assistant_test  crm_test       samenet   scram-sha-256
