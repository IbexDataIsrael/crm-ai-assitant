<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 20px; margin: 0 auto; max-width: 800px; padding: 16px; background: #fff; color: #222; }
    h1 { font-size: 28px; }
    #log { border: 1px solid #ccc; border-radius: 6px; padding: 12px; min-height: 300px; margin-bottom: 12px; }
    .msg { margin: 10px 0; padding: 10px; border-radius: 6px; }
    .text { white-space: pre-wrap; }
    .user { background: #e8f0fe; }
    .bot { background: #f3f3f3; }
    .meta { font-size: 16px; color: #555; margin-top: 8px; }
    .demo { color: #a33; font-weight: bold; }
    .section { border-radius: 6px; padding: 10px; margin: 8px 0; border-inline-start: 6px solid; }
    .section-title { font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px; }
    .answer { background: #eaf6ec; border-color: #2e7d32; }
    .notice { background: #fff8e1; border-color: #b7791f; }
    .error { background: #fdecea; border-color: #c62828; }
    .sources { background: #fff; border-color: #607d8b; }
    .source { border-top: 1px solid #ddd; padding: 8px 0; }
    .source:first-of-type { border-top: none; }
    .source-head { font-size: 16px; color: #333; }
    .cited { font-size: 14px; font-weight: bold; color: #fff; background: #2e7d32; border-radius: 4px; padding: 1px 6px; margin-inline-start: 6px; }
    .small { font-size: 16px; color: #555; }
    form { display: flex; gap: 8px; }
    input { flex: 1; font-size: 20px; padding: 10px; min-width: 0; }
    button { font-size: 20px; padding: 10px 20px; cursor: pointer; }
    button:disabled { cursor: not-allowed; color: #777; }
    .hidden { display: none !important; }
    .panel { border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    #login-form { flex-direction: column; align-items: stretch; }
    #login-form label { font-size: 16px; color: #333; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .group-title { font-size: 16px; font-weight: bold; margin-top: 10px; }
    .crm-link { display: inline-block; margin-top: 6px; }
    .live { color: #8a4b00; font-weight: bold; }
    .multi { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .multi label { display: flex; gap: 8px; align-items: center; font-size: 18px; }
    /* Long lists (floors, report numbers): one per line, scrolling, with a filter box. */
    .long { flex-direction: column; flex-wrap: nowrap; align-items: stretch; max-height: 320px; overflow-y: auto; }
    .long button { text-align: start; }
    .filter { margin-top: 8px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="top">
    <h1 data-t="title">CRM Assistant</h1>
  </div>
  <p class="demo" data-t="banner_demo"></p>
  <p class="live" data-t="banner_live"></p>

  <section id="login-panel" class="panel">
    <!-- Before login the page is English only; after login it takes the user's language from the CRM. -->
    <form id="login-form">
      <label for="username">CRM username or email</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-button">Log in</button>
    </form>
    <div id="org-choice" class="hidden">
      <p>This login belongs to several organizations. Choose one:</p>
      <div id="org-buttons" class="choices"></div>
    </div>
    <div id="login-error" class="section error hidden"></div>
  </section>

  <div id="session" class="row hidden">
    <span class="small" data-t="logged_in"></span>
    <button type="button" id="logout" data-t="log_out"></button>
  </div>

  <div id="log"></div>
  <form id="form" class="hidden">
    <input id="message" autocomplete="off" data-t-placeholder="placeholder" aria-label="Message">
    <button type="submit" data-t="send"></button>
    <!-- Shown during any operation; off only while a request is in flight (it can't be recalled). -->
    <button type="button" id="cancel" class="hidden" data-t="cancel"></button>
  </form>

  <script>
    // --- The user's language (docs/instructions19.md, instructions20.md) -------
    // The CRM's interface language (preference "locale"), read at login and when a
    // remembered login is resumed. The chat never changes it: no toggle, no switch.
    // One he/en dictionary for every text the page writes itself. Server replies
    // arrive already in that language; CRM values, labels, IDs and guide
    // passages are shown exactly as they come.
    const TEXT = {
      en: {
        title: "CRM Assistant",
        banner_demo: "Ask a question searches the CRM user guides (English and Hebrew); an AI-written answer appears only when an answer provider key is set.",
        banner_live: "Typing a name, phone or address searches the real CRM. Adding a person or changing an apartment saves to the real CRM - only after you confirm with \"yes\".",
        logged_in: "Logged in to the CRM.",
        log_out: "Log out",
        placeholder: "Type a message...",
        send: "Send",
        cancel: "Cancel",
        cancelled: "Cancelled. Nothing more will be sent to the CRM.",
        cancelled_uncertain: "Cancelled. The CRM's answer to the last change was lost, so I can't tell whether it was saved - please check it in the CRM.",
        menu: "Write what you need in your own words - for example \"I met Moshe Levi today, he lives at Herzl 10, 050-1234567\", \"record a visit at Dana Katz, tefillin\", \"change Rachel Cohen's phone to 052-7654321\" - or just a name, phone number or address to search.",
        menu_ask: "Ask a question",
        people_title: "People",
        apartments_title: "Apartments",
        yes: "yes",
        no: "no",
        save: "Save",
        filter: "Filter...",
        answer_title: "AI-generated answer ({provider}, {model})",
        answer_note: "Based only on the source passages below. Cited: {cited}",
        insufficient_title: "No answer - the sources don't cover this",
        insufficient_text: "{provider} ({model}) found that the passages below don't answer this question.",
        off_title: "No AI-written answer - generation is off",
        off_text: "{error}. Showing the retrieved passages only.",
        failed_title: "Error - answer generation failed",
        failed_note: "No answer was generated. The passages below are retrieval results only.",
        sources_title: "Source passages - local semantic retrieval (CRM user guides)",
        similarity: "similarity",
        cited: "cited",
        route: "Route: {route} ({source}) · ",
        demo_action: "Demo CRM data - no live CRM",
        demo: "Demo - no live CRM",
        request_failed: "Error - request failed",
        http_error: "The server returned HTTP {status}.",
        server_unreachable: "Could not reach the server ({error}).",
        login_expired: "Your CRM login is no longer valid. Please log in again.",
        assistant_unreachable: "Could not reach the assistant server.",
        login_failed: "Login failed ({status}).",
        login: {
          invalid_credentials: "Incorrect username or password.",
          not_verified: "This account's email is not verified yet.",
          org_pending: "Your organization is still waiting for approval.",
          org_disabled: "Your organization has been disabled. Contact support.",
          login_refused: "The CRM refused this login.",
          rate_limited: "Too many login attempts. Wait a little and try again.",
          crm_not_configured: "The assistant is not connected to a CRM (CRM_API_URL is not set).",
          crm_unreachable: "Could not reach the CRM.",
          crm_timeout: "The CRM did not answer in time.",
          invalid_request: "Enter a username (or email) and a password.",
        },
      },
      he: {
        title: "עוזר ה-CRM",
        banner_demo: "\"שאלה\" מחפשת במדריכים למשתמש של ה-CRM (באנגלית ובעברית); תשובה שנכתבה ב-AI מופיעה רק כשמוגדר מפתח לספק תשובות.",
        banner_live: "הקלדת שם, טלפון או כתובת מחפשת ב-CRM האמיתי. הוספת אדם או שינוי בדירה נשמרים ב-CRM האמיתי - רק אחרי שתאשרו ב\"כן\".",
        logged_in: "מחוברים ל-CRM.",
        log_out: "התנתקות",
        placeholder: "כתבו הודעה...",
        send: "שליחה",
        cancel: "ביטול",
        cancelled: "בוטל. לא יישלח עוד דבר ל-CRM.",
        cancelled_uncertain: "בוטל. התשובה מה-CRM על השינוי האחרון אבדה, ולכן אינני יודע אם הוא נשמר - אנא בדקו אותו ב-CRM.",
        menu: "כתבו מה צריך במילים שלכם - למשל \"פגשתי היום את משה לוי, גר בהרצל 10, 050-1234567\", \"ביקור אצל דנה כץ, הניח תפילין\", \"תשנה את הטלפון של רחל כהן ל-052-7654321\" - או רק שם, טלפון או כתובת לחיפוש.",
        menu_ask: "שאלה",
        people_title: "אנשים",
        apartments_title: "דירות",
        yes: "כן",
        no: "לא",
        save: "שמירה",
        filter: "סינון...",
        answer_title: "תשובה שנכתבה ב-AI ({provider}, {model})",
        answer_note: "מבוססת רק על קטעי המקור שלהלן. צוטטו: {cited}",
        insufficient_title: "אין תשובה - המקורות לא מכסים את זה",
        insufficient_text: "{provider} ({model}) מצא שהקטעים שלהלן אינם עונים על השאלה.",
        off_title: "אין תשובה שנכתבה ב-AI - יצירת התשובות כבויה",
        off_text: "{error}. מוצגים רק הקטעים שנמצאו.",
        failed_title: "שגיאה - יצירת התשובה נכשלה",
        failed_note: "לא נוצרה תשובה. הקטעים שלהלן הם תוצאות חיפוש בלבד.",
        sources_title: "קטעי מקור - חיפוש סמנטי מקומי (המדריכים למשתמש של ה-CRM)",
        similarity: "דמיון",
        cited: "צוטט",
        route: "מסלול: {route} ({source}) · ",
        demo_action: "נתוני CRM להדגמה - לא CRM חי",
        demo: "הדגמה - לא CRM חי",
        request_failed: "שגיאה - הבקשה נכשלה",
        http_error: "השרת החזיר HTTP {status}.",
        server_unreachable: "לא ניתן להגיע לשרת ({error}).",
        login_expired: "ההתחברות ל-CRM כבר אינה בתוקף. אנא התחברו שוב.",
        assistant_unreachable: "לא ניתן להגיע לשרת העוזר.",
        login_failed: "ההתחברות נכשלה ({status}).",
        login: {
          invalid_credentials: "שם משתמש או סיסמה שגויים.",
          not_verified: "כתובת האימייל של החשבון עדיין לא אומתה.",
          org_pending: "הארגון שלכם עדיין ממתין לאישור.",
          org_disabled: "הארגון שלכם הושבת. פנו לתמיכה.",
          login_refused: "ה-CRM דחה את ההתחברות.",
          rate_limited: "יותר מדי ניסיונות התחברות. המתינו ונסו שוב.",
          crm_not_configured: "העוזר אינו מחובר ל-CRM (CRM_API_URL לא הוגדר).",
          crm_unreachable: "לא ניתן להגיע ל-CRM.",
          crm_timeout: "ה-CRM לא ענה בזמן.",
          invalid_request: "הזינו שם משתמש (או אימייל) וסיסמה.",
        },
      },
    };

    // Before login: English only. After login: the CRM's value (English when it has none).
    let language = "en";

    function t(key, values) {
      let text = TEXT[language][key];
      Object.entries(values || {}).forEach(([name, value]) => { text = text.split("{" + name + "}").join(String(value)); });
      return text;
    }

    function applyLanguage() {
      document.documentElement.lang = language;
      document.documentElement.dir = language === "he" ? "rtl" : "ltr";
      document.title = t("title");
      document.querySelectorAll("[data-t]").forEach(n => { n.textContent = t(n.getAttribute("data-t")); });
      document.querySelectorAll("[data-t-placeholder]").forEach(n => { n.placeholder = t(n.getAttribute("data-t-placeholder")); });
    }

    const log = document.getElementById("log");
    const input = document.getElementById("message");

    // Small helper: an element with a class and plain text (never HTML from the server).
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // A bot bubble in the current language's direction.
    function botBubble() {
      const div = el("div", "msg bot");
      div.dir = language === "he" ? "rtl" : "ltr";
      return div;
    }

    function section(cls, title) {
      const box = el("section", "section " + cls);
      box.appendChild(el("h2", "section-title", title));
      return box;
    }

    // Part 1 of a knowledge reply: the AI answer, or why there is none.
    function answerSection(g) {
      if (g.status === "answered") {
        const box = section("answer", t("answer_title", { provider: g.provider, model: g.model }));
        box.appendChild(el("div", "text", g.answer));
        const cited = g.citations.map(c => "[" + c.number + "] " + c.filename + " > " + c.heading).join("; ");
        box.appendChild(el("div", "small", t("answer_note", { cited })));
        return box;
      }
      if (g.status === "insufficient_sources") {
        const box = section("notice", t("insufficient_title"));
        box.appendChild(el("div", "text", t("insufficient_text", { provider: g.provider, model: g.model })));
        return box;
      }
      if (g.status === "no_api_key") {
        const box = section("notice", t("off_title"));
        box.appendChild(el("div", "text", t("off_text", { error: g.error })));
        return box;
      }
      const box = section("error", t("failed_title"));
      box.appendChild(el("div", "text", g.error));
      box.appendChild(el("div", "small", t("failed_note")));
      return box;
    }

    // Part 2: the retrieved passages, marked when the answer cited them.
    function sourcesSection(passages, g) {
      const citedNumbers = new Set((g && g.status === "answered") ? g.citations.map(c => c.number) : []);
      const box = section("sources", t("sources_title"));
      passages.forEach((p, i) => {
        const item = el("div", "source");
        const head = el("div", "source-head", "[" + (i + 1) + "] " + p.filename + " > " + p.heading + " (" + t("similarity") + " " + p.score.toFixed(2) + ")");
        if (citedNumbers.has(i + 1)) head.appendChild(el("span", "cited", t("cited")));
        item.appendChild(head);
        const passage = el("div", "text", p.text);
        passage.dir = "auto";  // a passage keeps its guide's language
        item.appendChild(passage);
        box.appendChild(item);
      });
      return box;
    }

    function metaLine(data) {
      const m = el("div", "meta", t("route", { route: data.route, source: data.route_source }));
      m.appendChild(el("span", "demo", data.route === "action" ? t("demo_action") : t("demo")));
      return m;
    }

    function addUser(text) {
      const div = el("div", "msg user");
      div.dir = "auto";  // the user's own words, in whatever language they were typed
      div.appendChild(el("div", "text", text));
      log.appendChild(div);
      div.scrollIntoView();
    }

    function addBot(data) {
      const div = botBubble();
      if (data.route === "knowledge" && data.generation) {
        div.appendChild(answerSection(data.generation));
        div.appendChild(sourcesSection(data.passages, data.generation));
      } else {
        div.appendChild(el("div", "text", data.reply));  // action / clarify: unchanged demo text
      }
      div.appendChild(metaLine(data));
      log.appendChild(div);
      div.scrollIntoView();
    }

    function addRequestError(message) {
      const div = botBubble();
      const box = section("error", t("request_failed"));
      box.appendChild(el("div", "text", message));
      div.appendChild(box);
      log.appendChild(div);
      div.scrollIntoView();
    }

    // --- Login, menu and the conversation -----------------------------------
    // The CRM token is remembered in localStorage, like the CRM's own site does, so a reload
    // or a new tab stays logged in. It lasts as long as the CRM accepts it (the CRM checks it
    // on every turn) and at most 30 days here. Logging out or any 401 forgets it, together
    // with the conversation state (fields and pending proposal), which is never stored.
    const TOKEN_KEY = "crm-assistant.login";
    const REMEMBER_MS = 30 * 24 * 60 * 60 * 1000;
    let token = null;

    function rememberLogin(value) {
      try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: value, since: Date.now() })); } catch (e) {}
    }

    function forgetLogin() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }

    function rememberedLogin() {
      try {
        const kept = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
        if (kept && typeof kept.token === "string" && Date.now() - kept.since < REMEMBER_MS) return kept.token;
      } catch (e) {}
      forgetLogin();
      return null;
    }
    // null = the free-text box searches the CRM (docs/instructions20.md). Otherwise the flow
    // a button or the server's answer started; never guessed from free text on the page.
    let intent = null;
    let searchState = null;   // search state, as the server returned it (an add offer waiting)
    let conversation = null;  // create_contact state, as the server returned it
    let apartmentState = null;  // edit_apartment state, as the server returned it
    let personState = null;  // person state (open / edit a field / record a visit), as the server returned it
    // One turn at a time: while a request is in flight, sending and every
    // choice button are off, so one tap can never send an update twice.
    let busy = false;

    const loginForm = document.getElementById("login-form");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const loginError = document.getElementById("login-error");
    const orgChoice = document.getElementById("org-choice");
    const orgButtons = document.getElementById("org-buttons");
    const chatForm = document.getElementById("form");
    const cancelButton = document.getElementById("cancel");

    function show(node, visible) { node.classList.toggle("hidden", !visible); }

    function clearConversation() {
      intent = null;
      conversation = null;
      apartmentState = null;
      personState = null;
      searchState = null;
      show(cancelButton, false);
    }

    // Cancel: drop the conversation (the server keeps none), so nothing more is sent.
    // Every earlier button is switched off, so no old step can be sent afterwards.
    function cancelOperation() {
      if (busy || !intent) return;
      const uncertain = (apartmentState && apartmentState.step === "blocked")
        || (personState && (personState.step === "blocked" || personState.step === "visit_blocked"))
        || (conversation && conversation.pending && conversation.pending.uncertain);
      addUser(t("cancel"));
      log.querySelectorAll("button, input").forEach(n => { n.disabled = true; });
      clearConversation();
      addConversationReply({ reply: t(uncertain ? "cancelled_uncertain" : "cancelled") });
      addMenu();
    }

    function setBusy(value) {
      busy = value;
      chatForm.querySelectorAll("input, button").forEach(n => { n.disabled = value; });
    }

    function logout(reason) {
      token = null;
      forgetLogin();
      clearConversation();
      // The login screen is English only; the next login reads the CRM's value again.
      language = "en";
      applyLanguage();
      password.value = "";
      show(orgChoice, false);
      show(loginForm, true);
      show(document.getElementById("login-panel"), true);
      show(document.getElementById("session"), false);
      show(chatForm, false);
      log.replaceChildren();
      if (reason) {
        // Every reason here is an ended login; the login screen says so in its own (English) words.
        loginError.textContent = t("login_expired");
        show(loginError, true);
      }
    }

    function loggedIn(newToken, crmLanguage) {
      clearConversation();  // a new token never inherits earlier state
      log.replaceChildren();
      token = newToken;
      rememberLogin(newToken);
      username.value = "";
      password.value = "";
      // The CRM value at every new session; without one, English. Never saved by the chat.
      language = crmLanguage === "he" || crmLanguage === "en" ? crmLanguage : "en";
      applyLanguage();
      show(document.getElementById("login-panel"), false);
      show(document.getElementById("session"), true);
      show(chatForm, true);
      addMenu();
    }

    // A reopened page with a remembered login: the server checks it with the CRM and reads
    // the language again. 401 -> forgotten; any other failure -> the login screen, token kept.
    async function resumeLogin() {
      const kept = rememberedLogin();
      if (!kept) return;
      let res, data;
      try {
        res = await fetch("/auth/session", { method: "POST", headers: { "Authorization": "Bearer " + kept } });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        res = null;
      }
      if (token) return;  // logged in by hand meanwhile
      if (res && res.ok && data.status === "logged_in") {
        loggedIn(kept, data.language);
        return;
      }
      if (res && res.status === 401) forgetLogin();
      else {
        loginError.textContent = (data && data.reply) || t("assistant_unreachable");
        show(loginError, true);
      }
    }

    async function login(organizationId) {
      show(loginError, false);
      const body = { username: username.value, password: password.value };
      if (organizationId !== undefined) body.organization_id = organizationId;
      let res, data;
      try {
        res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        data = await res.json();
      } catch (err) {
        password.value = "";
        loginError.textContent = t("assistant_unreachable");
        show(loginError, true);
        return;
      }
      if (res.ok && data.status === "logged_in") {
        loggedIn(data.access_token, data.language);
        return;
      }
      if (res.ok && data.status === "choose_organization") {
        // The password stays in its field until an organization is chosen, then it is cleared.
        orgButtons.replaceChildren();
        data.organizations.forEach(org => {
          const b = el("button", null, org.name);
          b.type = "button";
          b.addEventListener("click", () => login(org.id));
          orgButtons.appendChild(b);
        });
        show(loginForm, false);
        show(orgChoice, true);
        return;
      }
      password.value = "";
      show(orgChoice, false);
      show(loginForm, true);
      loginError.textContent = TEXT[language].login[data.status] || t("login_failed", { status: data.status || res.status });
      show(loginError, true);
    }

    loginForm.addEventListener("submit", (e) => { e.preventDefault(); login(); });
    document.getElementById("logout").addEventListener("click", () => logout());
    cancelButton.addEventListener("click", () => cancelOperation());

    // The start: one free-text box (it searches the CRM) and the guide questions button.
    function addMenu() {
      const div = botBubble();
      div.appendChild(el("div", "text", t("menu")));
      const choices = el("div", "choices");
      const ask = el("button", null, t("menu_ask"));
      ask.type = "button";
      ask.addEventListener("click", () => choose("ask_question", ask.textContent));
      choices.append(ask);
      div.appendChild(choices);
      log.appendChild(div);
      div.scrollIntoView();
    }

    function choose(newIntent, label, extra, message) {
      if (busy) return;
      clearConversation();
      intent = newIntent;
      show(cancelButton, true);
      addUser(label);
      sendTurn(message || "", extra);
    }

    // A search answer: the count, then People / Apartments as buttons that open the record.
    function addSearchReply(data) {
      log.querySelectorAll(".search-choices button").forEach(n => { n.disabled = true; });
      const div = botBubble();
      const choices = data.choices || [];
      div.appendChild(el("div", "text", choices.length ? data.prompt : data.reply));
      const groups = { people: t("people_title"), apartments: t("apartments_title") };
      let row = null, group;
      choices.forEach(c => {
        if (!row || c.group !== group) {
          group = c.group;
          if (groups[group]) div.appendChild(el("div", "group-title", groups[group]));
          const many = groups[group] && choices.filter(x => x.group === group).length > 1;
          row = el("div", "choices search-choices" + (many ? " long" : ""));
          div.appendChild(row);
        }
        const b = el("button", null, c.label);
        b.type = "button";
        b.addEventListener("click", () => pick(c));
        row.appendChild(b);
      });
      if (data.link) addLink(div, data.link);
      log.appendChild(div);
      div.scrollIntoView();
    }

    function addLink(div, link) {
      // Only an http(s) address the server built from CRM_WEB_URL; opened in a new tab.
      if (!/^https?:\/\//.test(link.url)) return;
      const a = document.createElement("a");
      a.className = "crm-link";
      a.setAttribute("href", link.url);
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
      a.textContent = link.label;
      div.appendChild(a);
    }

    function pick(choice) {
      if (busy) return;
      if (choice.action === "open_apartment") choose("edit_apartment", choice.label, { open_id: choice.id });
      else if (choice.action === "open_person") choose("person", choice.label, { open_id: choice.id });
      // The user's own request travels with the button, so its details reach the add flow.
      else if (choice.action === "add_person") choose("create_contact", choice.label, undefined, choice.message);
      else if (choice.action === "dismiss") {
        // "No" to the add offer: the server answers it (the offer is in searchState).
        addUser(choice.label);
        sendTurn(t("no"));
      }
    }

    function addConversationReply(data) {
      const div = botBubble();
      div.appendChild(el("div", "text", data.reply));
      const s = data.state;
      const waiting = data.awaiting_confirmation || (s && s.pending && s.pending.uncertain) || (s && s.restart_offered);
      if (waiting) {
        const choices = el("div", "choices");
        const yes = el("button", null, t("yes"));
        yes.type = "button";
        yes.addEventListener("click", () => { addUser(yes.textContent); sendTurn(yes.textContent); });
        const no = el("button", null, t("no"));
        no.type = "button";
        no.addEventListener("click", () => { addUser(no.textContent); sendTurn(no.textContent); });
        choices.append(yes, no);
        div.appendChild(choices);
      }
      log.appendChild(div);
      div.scrollIntoView();
    }

    // A tap on a button sends its message as a turn (ignored while busy).
    function tap(label, message) {
      if (busy) return;
      addUser(label);
      sendTurn(message);
    }

    function addApartmentReply(data) {
      // Earlier steps' buttons no longer apply: a stale pick must never be sent.
      log.querySelectorAll(".apt-choices button, .apt-choices input, input.apt-choices").forEach(n => { n.disabled = true; });
      const div = botBubble();
      const choices = data.choices || [];
      // With buttons the numbered list is shown once, as the buttons; the full text is in data.reply.
      div.appendChild(el("div", "text", choices.length && data.prompt ? data.prompt : data.reply));
      const long = choices.length > 8;
      function addFilter(box, items) {
        // Typing narrows a long list; the numbers stay the CRM list's numbers.
        const filter = document.createElement("input");
        filter.className = "filter apt-choices";
        filter.placeholder = t("filter");
        filter.setAttribute("aria-label", filter.placeholder);
        filter.addEventListener("input", () => {
          const wanted = filter.value.trim().toLowerCase();
          items.forEach(n => n.classList.toggle("hidden", !!wanted && !n.textContent.toLowerCase().includes(wanted)));
        });
        div.insertBefore(filter, box);
      }
      if (data.multi && choices.length) {
        const box = el("div", "multi apt-choices" + (long ? " long" : ""));
        const boxes = choices.map(c => {
          const label = el("label");
          const check = document.createElement("input");
          check.type = "checkbox";
          check.value = c.message;
          check.checked = !!c.checked;  // ticked already from the user's own request
          label.append(check, document.createTextNode(c.label));
          box.appendChild(label);
          return check;
        });
        const save = el("button", null, t("save"));
        save.type = "button";
        save.addEventListener("click", () => {
          const picked = boxes.filter(b => b.checked).map(b => b.value);
          const labels = boxes.filter(b => b.checked).map(b => b.parentNode.textContent);
          // Nothing ticked = clear the list, only through the server's clear button.
          if (picked.length) tap(labels.join(", "), picked.join(","));
          else if (data.clear) tap(data.clear.label, data.clear.message);
        });
        div.appendChild(box);
        if (long) addFilter(box, boxes.map(b => b.parentNode));
        const saveRow = el("div", "choices apt-choices");
        saveRow.appendChild(save);
        div.appendChild(saveRow);
      } else if (choices.length) {
        const row = el("div", "choices apt-choices" + (long ? " long" : ""));
        const buttons = choices.map(c => {
          const b = el("button", null, c.label);
          b.type = "button";
          b.addEventListener("click", () => tap(c.label, c.message));
          row.appendChild(b);
          return b;
        });
        div.appendChild(row);
        if (long) addFilter(row, buttons);
      }
      if (data.link) addLink(div, data.link);
      if (data.awaiting_check) {
        const row = el("div", "choices apt-choices");
        [t("yes"), t("no")].forEach(word => {
          const b = el("button", null, word);
          b.type = "button";
          b.addEventListener("click", () => tap(word, word));
          row.appendChild(b);
        });
        div.appendChild(row);
      }
      log.appendChild(div);
      div.scrollIntoView();
    }

    async function sendTurn(message, extra) {
      if (busy) return;
      setBusy(true);
      try {
        await sendTurnNow(message, extra);
      } finally {
        setBusy(false);
      }
    }

    async function sendTurnNow(message, extra) {
      const sentWith = token;
      const headers = { "Content-Type": "application/json" };
      // Every intent needs the login now: the server checks it with the CRM first.
      headers["Authorization"] = "Bearer " + token;
      const body = { intent: intent || "search", message, language, ...(extra || {}) };
      if (intent === "create_contact" && conversation) body.state = conversation;
      if (intent === "edit_apartment" && apartmentState) body.apartment_state = apartmentState;
      if (intent === "person" && personState) body.person_state = personState;
      if (!intent && searchState) body.search_state = searchState;
      try {
        const res = await fetch("/assistant/turn", { method: "POST", headers, body: JSON.stringify(body) });
        if (token !== sentWith) return;  // logged out or another login meanwhile: drop the answer
        if (res.status === 401) {
          const data = await res.json().catch(() => ({}));
          logout(data.reply || t("login_expired"));
          return;
        }
        if ([400, 403, 429, 503].includes(res.status)) {
          // Not a login problem: show the server's message and keep the session.
          const data = await res.json().catch(() => ({}));
          addRequestError(data.reply || t("http_error", { status: res.status }));
          return;
        }
        if (!res.ok) {
          addRequestError(t("http_error", { status: res.status }));
          return;
        }
        const data = await res.json();
        if (data.intent === "ask_question" && data.outcome === "answered") {
          addBot(data);
        } else if (data.intent === "edit_apartment") {
          // A search may hand over to a flow (e.g. "change 2C to ..."): the page follows the server.
          intent = "edit_apartment";
          show(cancelButton, true);
          apartmentState = data.state;
          addApartmentReply(data);
          if (data.logout) logout(data.reply);
        } else if (data.intent === "person") {
          // A person: the same step-by-step buttons as an apartment (edit a field, record a visit).
          intent = "person";
          show(cancelButton, true);
          personState = data.state;
          addApartmentReply(data);
          if (data.logout) logout(data.reply);
        } else if (data.intent === "create_contact") {
          intent = "create_contact";
          show(cancelButton, true);
          conversation = data.state;
          addConversationReply(data);
          if (data.logout) logout(data.reply);
        } else if (data.intent === "search") {
          // Back to (or still in) the free-text box: no flow open, nothing to cancel.
          clearConversation();
          searchState = data.search_state || null;
          addSearchReply(data);
          if (data.logout) logout(data.reply);
        } else {
          addConversationReply(data);
        }
        if (data.show_menu) {
          clearConversation();
          addMenu();
        }
      } catch (err) {
        addRequestError(t("server_unreachable", { error: err }));
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      addUser(message);
      input.value = "";
      sendTurn(message);  // with no flow open, the text is a search
    });

    applyLanguage();
    resumeLogin();
  </script>
</body>
</html>
