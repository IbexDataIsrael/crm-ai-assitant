name: Deploy crm-ai-assitant to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-assistant-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up restricted SSH credentials
        env:
          ASSISTANT_DEPLOY_KEY: ${{ secrets.ASSISTANT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ASSISTANT_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '167.233.238.179 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH122dZIBcsUKG8ICfdhUf3l9HiZLJcCTrcZqJ0TGXpm\n' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Deploy main on VPS
        env:
          VPS_USER: zvi
        run: |
          set -euo pipefail
          test "$VPS_USER" = "zvi"
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@167.233.238.179" "deploy ${{ github.sha }}"
